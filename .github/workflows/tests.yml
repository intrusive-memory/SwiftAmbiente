name: Tests

on:
  pull_request:
    branches: [main, development]

jobs:
  # Fast unit tests — the procedural generator is dependency-free, so no model
  # download is required and the full suite runs on CI.
  unit-tests:
    name: Unit Tests
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: make test-unit
